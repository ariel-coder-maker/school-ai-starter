# The engine: Level 2 of the School AI Starter.
#
#   docker compose -f engine/docker-compose.yml up -d      start (run from the kit folder)
#   docker compose -f engine/docker-compose.yml down       stop; your data is kept
#
# NEVER add -v to "down". It deletes the database, and every approval and cost
# record with it.
#
# Three parts, all on this computer:
#   postgres   the database: approvals, versions and the cost of every AI call
#   engine     the scripts that build each step, check it, and make Word and
#              PowerPoint files. Also serves a plain teacher page on ENGINE_PORT
#   n8n        the visual workflow tool, with a ready-made form that calls the engine
#
# The whole kit folder is mounted at /kit, so the engine reads 00_school/ to
# 05_checks/ and writes to 01_curriculum/<subject>/units/ and 06_outputs/.

name: school-ai-starter

services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-once}
      POSTGRES_DB: school_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_ai -d school_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    image: node:22.20.0-bookworm-slim
    restart: unless-stopped
    # Files the engine writes belong to an ordinary user, so teachers can edit
    # them. On Linux, set KIT_UID and KIT_GID in .env to your own (run: id).
    user: "${KIT_UID:-1000}:${KIT_GID:-1000}"
    working_dir: /kit/engine/gen
    env_file: .env
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      KIT_DIR: /kit
      DATABASE_URL: postgres://school_ai:${POSTGRES_PASSWORD:-change-me-once}@postgres:5432/school_ai
      ENGINE_PORT: 3000
      ENGINE_PORT_HOST: ${ENGINE_PORT:-3000}
      # n8n reaches the engine here, on the Docker network only (never published).
      ENGINE_INTERNAL_PORT: 3001
    volumes:
      - ../:/kit
    ports:
      - "127.0.0.1:${ENGINE_PORT:-3000}:3000"
    command: sh -c "npm install --omit=dev --no-audit --no-fund --no-update-notifier --loglevel=error && node server.js"
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.28.6
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
      N8N_SECURE_COOKIE: "false"          # needed for plain http://localhost
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/   # so form links use the port you chose
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    depends_on:
      - engine

volumes:
  postgres_data:
  n8n_data:
